name: Test-Firmware

on:
  workflow_dispatch:
    inputs:
      build_branch:
        description: '编译主分支 (如: openwrt-25.12)'
        required: true
        type: string
        default: 'openwrt-25.12'
      packages:
        description: 'Packages 分支或完整 src-git 行'
        required: false
        type: string
        default: 'openwrt-25.12'
      luci:
        description: 'LuCI 分支或完整 src-git 行'
        required: false
        type: string
        default: 'openwrt-25.12'
      ssh:
        description: '开启 SSH 连接 (调试用)'
        required: false
        type: boolean
        default: false
      pure_firmware:
        description: '编译纯净固件 (不注入配置和 public)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build - immortalwrt-x86 (${{ inputs.build_branch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    env:
      TARGET_Name: immortalwrt-x86
      BUILD_TYPE: x86
      REPO_URL: https://github.com/immortalwrt/immortalwrt
      REPO_BRANCH: ${{ inputs.build_branch }}
      TZ: Asia/Shanghai

    steps:
    - name: Checkout Private Config Repo
      uses: actions/checkout@v6
      with:
        repository: Saxon-Sun/Route-config-Files
        token: ${{ secrets.pw }}
        path: Route-config-Files
        fetch-depth: 1

    - name: Maximize Build Space
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 创建模拟物理磁盘 (LVM)
      run: |
        mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
        root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
        sudo truncate -s "${mnt_size}"G /mnt/mnt.img
        sudo truncate -s "${root_size}"G /root.img
        sudo losetup /dev/loop6 /mnt/mnt.img
        sudo losetup /dev/loop7 /root.img
        sudo pvcreate /dev/loop6
        sudo pvcreate /dev/loop7
        sudo vgcreate github /dev/loop6 /dev/loop7
        sudo lvcreate -n runner -l 100%FREE github
        sudo mkfs.xfs /dev/github/runner
        sudo mkdir -p /github-builder
        sudo mount /dev/github/runner /github-builder
        sudo chown -R $USER:$GROUPS /github-builder
        df -Th

    - name: Initialize Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone $TZ
        sudo apt-get update && sudo apt-get install -y ccache

    - name: Clone Source Code
      working-directory: /github-builder
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /github-builder/openwrt $GITHUB_WORKSPACE/openwrt

    # =======================================================
    # 动态写入/覆盖 feeds.conf.default
    # =======================================================
    - name: Override feeds.conf.default
      working-directory: /github-builder/openwrt
      run: |
        echo "正在配置 feeds.conf.default..."
        
        # 处理 Packages
        PKG_IN="${{ inputs.packages }}"
        [ -z "$PKG_IN" ] && PKG_IN="${{ inputs.build_branch }}"
        if [[ "$PKG_IN" == src-git* ]]; then
          PKG_LINE="$PKG_IN"
        else
          PKG_LINE="src-git packages https://github.com/immortalwrt/packages.git;$PKG_IN"
        fi

        # 处理 LuCI
        LUCI_IN="${{ inputs.luci }}"
        [ -z "$LUCI_IN" ] && LUCI_IN="${{ inputs.build_branch }}"
        if [[ "$LUCI_IN" == src-git* ]]; then
          LUCI_LINE="$LUCI_IN"
        else
          LUCI_LINE="src-git luci https://github.com/immortalwrt/luci.git;$LUCI_IN"
        fi

        # 覆盖文件内容
        cat > feeds.conf.default <<EOF
        $PKG_LINE
        $LUCI_LINE
        src-git routing https://github.com/immortalwrt/routing.git;${{ inputs.build_branch }}
        src-git telephony https://github.com/immortalwrt/telephony.git;${{ inputs.build_branch }}
        EOF

        echo "=== 生成的 feeds.conf.default 内容 ==="
        cat feeds.conf.default

    - name: Restore Ccache
      uses: actions/cache/restore@v5
      with:
        path: /github-builder/openwrt/.ccache
        key: ${{ runner.os }}-ccache-${{ env.BUILD_TYPE }}-${{ env.REPO_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ env.BUILD_TYPE }}-${{ env.REPO_BRANCH }}-
          ${{ runner.os }}-ccache-${{ env.BUILD_TYPE }}-

    - name: Configure Feeds & Apply Custom Configuration
      working-directory: /github-builder/openwrt
      run: |
        echo "正在导入私有配置..."
        cp -r $GITHUB_WORKSPACE/Route-config-Files .
        ls -R Route-config-Files 2>/dev/null | head -n 5
        chmod +x Route-config-Files/diy/*.sh && mv Route-config-Files/diy/*.sh .
        ./Add-Source.sh
        
        echo "更新并安装Feeds..."
        ./scripts/feeds update -a > /dev/null
        ./scripts/feeds install -a
        
        echo "正在应用自定义配置..."
        ./diy.sh $TARGET_Name ${{ inputs.pure_firmware }}
        make defconfig

    - name: Connect to Tailscale (SSH Debug)
      if: inputs.ssh == true
      uses: tailscale/github-action@v4.1.2
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
        args: --ssh

    - name: Send SSH Info Notification
      if: inputs.ssh == true
      working-directory: /github-builder/openwrt
      run: ./ssh_notify.sh "$TARGET_Name"

    - name: Download Dependencies
      working-directory: /github-builder/openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: /github-builder/openwrt
      id: compile
      run: |
        export CCACHE_DIR=$(pwd)/.ccache
        mkdir -p "$CCACHE_DIR"
        
        ccache -M 2G -F 0
        echo "====== Ccache 初始状态 ======"
        ccache -s
        echo "============================="
        
        echo "开始编译..."
        if ! make -j$(nproc); then
            echo "❌ 多线程编译失败，显示磁盘使用情况..."
            df -h
            echo "尝试单线程并输出日志..."
            make -j1 V=s
        fi
        echo "✅ 编译流程结束"
        
        echo "====== 编译后 Ccache 统计 ======"
        ccache -s
        echo "================================"
        
        echo "显示磁盘使用情况..."
        df -h

        echo "📦 统计体积最大的前 20 个软件包 (按实际文件大小排序)"
        if [ -d "bin/" ]; then
            find bin/ -type f \( -name "*.apk" -o -name "*.ipk" \) -exec du -b {} + 2>/dev/null | \
            sort -nr | \
            awk '
            BEGIN { count = 0 }
            {
                if (count >= 20) exit;
                count++;
                size=$1;
                name=$2;
                sub(/.*\//, "", name);
                if(size >= 1024*1024)
                    printf "[%02d] %8.2f MB  %s\n", count, size/1024/1024, name;
                else if(size >= 1024)
                    printf "[%02d] %8.2f KB  %s\n", count, size/1024, name;
                else
                    printf "[%02d] %8.2f B   %s\n", count, size, name;
            }'
        else
            echo "⚠️ 未找到 bin 目录，跳过体积统计"
        fi

        echo "开始清理临时文件与冗余组件..."
        rm -rf build_dir
        rm -rf $(find ./bin/targets/ -type d -name "packages") 2>/dev/null || true
        find ./bin/targets/ -type f -name "*squashfs-rootfs*" -exec echo "🗑️  删除文件: {}" \; -delete
        ls -la "$GITHUB_WORKSPACE"/openwrt/bin/targets/*/*/* 2>/dev/null || true
        
        if [ -n "$(find bin/targets/ -name '*.tar.gz' -o -name '*.img*' -o -name '*.bin' 2>/dev/null)" ]; then
             echo "status=success" >> $GITHUB_OUTPUT
        else
             echo "⚠️ 未检测到固件产物，可能编译失败"
        fi

    - name: Prepare Artifacts
      working-directory: /github-builder/openwrt
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        mkdir -p artifact/{firmware,package}
        find bin/targets/ -type f -exec cp -f {} artifact/firmware/ \;
        find bin/packages/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp -f {} artifact/package/ \;

    - name: Upload Firmware via Script
      working-directory: /github-builder/openwrt
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        ./upload.sh $TARGET_Name ${{ inputs.pure_firmware }}
        
    - name: Save Ccache
      if: steps.compile.outputs.status == 'success' && !cancelled()
      uses: actions/cache/save@v5
      with:
        path: /github-builder/openwrt/.ccache
        key: ${{ runner.os }}-ccache-${{ env.BUILD_TYPE }}-${{ env.REPO_BRANCH }}-${{ github.run_id }}

  cleanup:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
    - name: Cleanup Workflow Runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.pw }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 2