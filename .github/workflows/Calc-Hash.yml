name: OpenWrt Git 包 Hash 通用计算器

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Git 仓库地址'
        required: true
        default: ''
      commit:
        description: 'Commit SHA / 分支名 / Tag名 (留空默认最新 HEAD)'
        required: false
        default: ''

jobs:
  calc-hash:
    runs-on: ubuntu-latest

    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zstd

      - name: 使用 OpenWrt 标准方式计算 MIRROR_HASH
        shell: bash
        run: |

          set -e

          REPO_URL="${{ github.event.inputs.repo_url }}"
          INPUT_COMMIT="${{ github.event.inputs.commit }}"

          if [ -z "$INPUT_COMMIT" ]; then
              INPUT_COMMIT="HEAD"
          fi


          echo "仓库: $REPO_URL"
          echo "目标版本: $INPUT_COMMIT"


          # 仓库名称
          REPO_NAME=$(basename "$REPO_URL" .git)


          # 克隆
          git clone "$REPO_URL" source_repo

          cd source_repo


          # 定位目标 commit
          git checkout "$INPUT_COMMIT"


          # 完整 commit
          SOURCE_VERSION=$(git rev-parse HEAD)

          # OpenWrt version_abbrev 默认 7 位
          SHORT_VERSION=$(echo "$SOURCE_VERSION" | cut -c1-7)


          # commit 日期
          SOURCE_DATE=$(git log -1 \
              --format="%cd" \
              --date=format:"%Y-%m-%d")


          DATE_DOT=$(echo "$SOURCE_DATE" | tr '-' '.')


          # OpenWrt SUBDIR
          SUBDIR="${REPO_NAME}-${DATE_DOT}~${SHORT_VERSION}"

          FILE="${SUBDIR}.tar.zst"


          echo
          echo "SUBDIR=$SUBDIR"
          echo "FILE=$FILE"
          echo "COMMIT=$SOURCE_VERSION"
          echo "DATE=$SOURCE_DATE"


          cd ..


          #
          # 关键:
          # OpenWrt git 下载使用 git archive
          #
          git -C source_repo archive \
              --format=tar \
              --prefix="${SUBDIR}/" \
              "$SOURCE_VERSION" \
          | zstd -19 -T0 -q \
          > "$FILE"



          # SHA256
          MIRROR_HASH=$(sha256sum "$FILE" | awk '{print $1}')


          echo
          echo "================================"
          echo "计算完成"
          echo "================================"
          echo


          echo "## 🚀 OpenWrt MIRROR_HASH 计算完成" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "仓库:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REPO_URL\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "生成文件:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$FILE\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Makefile:" >> "$GITHUB_STEP_SUMMARY"

          echo '```makefile' >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_DATE:=$SOURCE_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_VERSION:=$SOURCE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "MIRROR_HASH:=$MIRROR_HASH" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"


          echo
          echo "SOURCE_DATE=$SOURCE_DATE"
          echo "SOURCE_VERSION=$SOURCE_VERSION"
          echo "MIRROR_HASH=$MIRROR_HASH"