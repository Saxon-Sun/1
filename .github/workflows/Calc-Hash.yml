name: OpenWrt 包 Hash 通用计算器

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Git 仓库地址'
        required: true
        default: ''
      commit:
        description: 'Commit SHA / 分支名 / Tag名 (留空默认拉取最新 HEAD)'
        required: false
        default: ''

jobs:
  calc-hash:
    runs-on: ubuntu-latest
    steps:
      - name: 安装打包依赖
        run: sudo apt-get update && sudo apt-get install -y zstd git tar perl coreutils curl bzip2 xz-utils

      - name: 自动解析并按 OpenWrt 标准打包计算
        run: |
          REPO_URL="${{ github.event.inputs.repo_url }}"
          INPUT_COMMIT="${{ github.event.inputs.commit }}"
          [ -z "$INPUT_COMMIT" ] && INPUT_COMMIT="HEAD"

          # 1. 下载 OpenWrt 官方最新版的 download.pl，确保打包逻辑 100% 与官方一致
          curl -sSL "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/download.pl" -o download.pl
          chmod +x download.pl

          # 2. 临时克隆，仅用于获取准确的 SHA 和 时间戳
          git clone "$REPO_URL" temp_repo
          cd temp_repo
          if [ "$INPUT_COMMIT" != "HEAD" ]; then
            git checkout "$INPUT_COMMIT"
          fi
          
          FULL_COMMIT=$(git rev-parse HEAD)
          SHORT_COMMIT=$(echo "$FULL_COMMIT" | cut -c1-7)
          SOURCE_DATE=$(git log -1 --format="%cd" --date=short)
          cd ..
          rm -rf temp_repo

          # 3. 组装标准变量
          DATE_DOT=$(echo "$SOURCE_DATE" | tr '-' '.')
          REPO_NAME=$(basename "$REPO_URL" .git)
          SUBDIR="${REPO_NAME}-${DATE_DOT}~${SHORT_COMMIT}"
          FILE="${SUBDIR}.tar.zst"

          # 4. 调用 OpenWrt 官方脚本执行标准的克隆、清理与打包
          # 创建 dl 目录供脚本输出
          mkdir -p dl
          export TZ=UTC
          
          # 严格对齐官方 download.mk 的参数传递顺序:
          # <target_dir> <filename> <hash> <md5> <url> <url_filename> <protocol> <version> <subdir>
          ./download.pl "dl" "$FILE" "" "" "$REPO_URL" "" "git" "$FULL_COMMIT" "$SUBDIR"

          # 5. 计算最终的 SHA256 Hash
          HASH=$(sha256sum "dl/$FILE" | awk '{print $1}')

          # 6. 输出 Markdown 结果
          echo "## 🚀 计算完成 (调用 OpenWrt 官方 download.pl 脚本)" >> $GITHUB_STEP_SUMMARY
          echo "目标仓库: \`$REPO_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "生成文件: \`$FILE\`" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 请复制下方代码替换 Makefile 内容：" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`makefile" >> $GITHUB_STEP_SUMMARY
          echo "SOURCE_DATE:=$SOURCE_DATE" >> $GITHUB_STEP_SUMMARY
          echo "SOURCE_VERSION:=$FULL_COMMIT" >> $GITHUB_STEP_SUMMARY
          echo "MIRROR_HASH:=$HASH" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY