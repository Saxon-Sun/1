name: OpenWrt 包 Hash 通用计算器

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Git 仓库地址'
        required: true
        default: ''
      commit:
        description: 'Commit SHA / 分支名 / Tag名 (留空默认拉取最新 HEAD)'
        required: false
        default: ''

jobs:
  calc-hash:
    runs-on: ubuntu-latest
    steps:
      - name: 安装打包依赖
        run: sudo apt-get update && sudo apt-get install -y zstd git tar coreutils

      - name: 100% 依照 OpenWrt 官方 rawgit 逻辑精准计算
        run: |
          REPO_URL="${{ github.event.inputs.repo_url }}"
          INPUT_COMMIT="${{ github.event.inputs.commit }}"
          [ -z "$INPUT_COMMIT" ] && INPUT_COMMIT="HEAD"

          # 0. 强制使用 UTC 时区
          export TZ=UTC

          # 1. 基础变量解析
          REPO_NAME=$(basename "$REPO_URL" .git)
          
          # 创建工作临时目录
          mkdir -p work_dir
          cd work_dir

          # 2. 模拟 OpenWrt 的 git clone 与 checkout
          git clone "$REPO_URL" temp_repo
          cd temp_repo
          if [ "$INPUT_COMMIT" != "HEAD" ]; then
            git checkout "$INPUT_COMMIT"
          fi

          # 3. 提取官方标准的 Commit 信息与时间戳 (%ct)
          FULL_COMMIT=$(git rev-parse HEAD)
          SHORT_COMMIT=$(echo "$FULL_COMMIT" | cut -c1-7)
          SOURCE_DATE=$(git log -1 --format="%cd" --date=short)
          TAR_TIMESTAMP=$(git log -1 --no-show-signature --format='@%ct')
          DATE_DOT=$(echo "$SOURCE_DATE" | tr '-' '.')

          # 4. 组装标准目录名与文件名
          SUBDIR="${REPO_NAME}-${DATE_DOT}~${SHORT_COMMIT}"
          FILE="${SUBDIR}.tar.zst"

          # 5. 执行 OpenWrt 官方的核心规程：git archive 提取归档 (应用 .gitattributes)
          git config core.abbrev 8
          git archive --format=tar HEAD --output="../${SUBDIR}.tar.git"
          
          # 6. 处理子模块 (如果存在 .gitmodules)
          if [ -f ".gitmodules" ]; then
              cd ..
              tar --numeric-owner --owner=0 --group=0 --ignore-failed-read -C temp_repo -f "${SUBDIR}.tar.git" -r .git .gitmodules 2>/dev/null
              rm -rf "$SUBDIR" && mkdir "$SUBDIR"
              tar -C "$SUBDIR" -xf "${SUBDIR}.tar.git"
              cd "$SUBDIR"
              git submodule update --init --recursive
              rm -rf .git .gitmodules
              cd ..
          else
              cd ..
              rm -rf "$SUBDIR" && mkdir "$SUBDIR"
              tar -C "$SUBDIR" -xf "${SUBDIR}.tar.git"
          fi

          # 7. 严格按照 OpenWrt 官方 dl_tar_pack 规则打包并使用 ultra -20 压缩
          # 官方定义: TAR --numeric-owner --owner=0 --group=0 --mode=a-s --sort=name --mtime="$TAR_TIMESTAMP" -c $(2) | zstd -T0 --ultra -20 -c
          tar --numeric-owner --owner=0 --group=0 --mode=a-s --sort=name \
              --mtime="$TAR_TIMESTAMP" \
              -c "$SUBDIR" | zstd -T0 --ultra -20 -c > "$FILE"

          # 8. 移动到根目录并计算 SHA256 Hash
          mv "$FILE" ../../"$FILE"
          cd ../../
          rm -rf work_dir

          HASH=$(sha256sum "$FILE" | awk '{print $1}')

          # 9. 输出结果
          echo "## 🚀 计算完成 (完全对齐 OpenWrt 官方源码逻辑)" >> $GITHUB_STEP_SUMMARY
          echo "目标仓库: \`$REPO_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "生成文件: \`$FILE\`" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 请复制下方代码替换 Makefile 内容：" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`makefile" >> $GITHUB_STEP_SUMMARY
          echo "SOURCE_DATE:=$SOURCE_DATE" >> $GITHUB_STEP_SUMMARY
          echo "SOURCE_VERSION:=$FULL_COMMIT" >> $GITHUB_STEP_SUMMARY
          echo "MIRROR_HASH:=$HASH" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY